<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北海鱈魚香絲｜北海道 2026.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --pixel:"Pixelify Sans","DotGothic16","PingFang TC","Noto Sans TC","Microsoft JhengHei",monospace;
  --sans:"Pixelify Sans",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --bg:#dce9f3;--bar:#f7fbff;--card:#ffffff;--card2:#eef5fb;--ink:#17203a;--muted:#56627f;
  --line:#17203a;--shadow:#17203a;--accent:#d4372c;--accent-ink:#ffffff;
  --blue:#2458c9;--blue-ink:#ffffff;--ok:#1f8a4c;--ok-ink:#ffffff;
  --tbd-bg:#ffe27a;--tbd-ink:#4d3500;--est-bg:#cde2ff;--est-ink:#0c3478;--opt-bg:#e5d9ff;--opt-ink:#35208a;
  --mt1:#8aa7d6;--mt2:#4d6fae;--snow:#ffffff;--sun:#ffb62e;--land:#f4f8fc;--land2:#dbe6f1;--sea:#a9cbe6;--flake:#ffffff;--flake-edge:rgba(36,88,201,.55);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1426;--bar:#151d38;--card:#1b2447;--card2:#222d57;--ink:#eef2fc;--muted:#a3b0d2;
    --line:#8ea2de;--shadow:#04070f;--accent:#ff7b6b;--accent-ink:#1a0805;
    --blue:#7fb0ff;--blue-ink:#07163a;--ok:#58d08a;--ok-ink:#04210f;
    --tbd-bg:#5b4500;--tbd-ink:#ffe27a;--est-bg:#1e3d73;--est-ink:#c3dcff;--opt-bg:#3a2d7a;--opt-ink:#d9ccff;
    --mt1:#2f3f7e;--mt2:#1d2a5c;--snow:#cdd9f7;--sun:#f6f0c2;--land:#26325f;--land2:#2f3d72;--sea:#121a35;--flake:#e8f0ff;--flake-edge:rgba(0,0,0,0);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1426;--bar:#151d38;--card:#1b2447;--card2:#222d57;--ink:#eef2fc;--muted:#a3b0d2;
  --line:#8ea2de;--shadow:#04070f;--accent:#ff7b6b;--accent-ink:#1a0805;
  --blue:#7fb0ff;--blue-ink:#07163a;--ok:#58d08a;--ok-ink:#04210f;
  --tbd-bg:#5b4500;--tbd-ink:#ffe27a;--est-bg:#1e3d73;--est-ink:#c3dcff;--opt-bg:#3a2d7a;--opt-ink:#d9ccff;
  --mt1:#2f3f7e;--mt2:#1d2a5c;--snow:#cdd9f7;--sun:#f6f0c2;--land:#26325f;--land2:#2f3d72;--sea:#121a35;--flake:#e8f0ff;--flake-edge:rgba(0,0,0,0);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--sans);padding-bottom:84px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
a{color:inherit}
:focus-visible{outline:3px dashed var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:3px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 12px}
.top .ttl{font:17px/1.2 var(--pixel);flex:1;min-width:0}
.top .ttl small{display:block;font:12px/1.3 var(--sans);color:var(--muted)}
.tbtn{font:13px var(--pixel);background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);
  padding:6px 10px;min-height:38px;cursor:pointer}
.tbtn:active{transform:translate(2px,2px);box-shadow:none}

.wrap{max-width:560px;margin:0 auto;padding:12px 12px 8px}
.banner{display:block;width:100%;height:84px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background:var(--sea);margin-bottom:16px}
.banner .m1{fill:var(--mt1)}.banner .m2{fill:var(--mt2)}.banner .snow{fill:var(--snow)}.banner .sun{fill:var(--sun)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 10px 12px 4px;margin:0 -2px;scrollbar-width:thin}
.chip{flex:0 0 auto;min-width:58px;text-align:center;text-decoration:none;background:var(--card);border:3px solid var(--line);
  box-shadow:3px 3px 0 var(--shadow);padding:4px 6px;font:12px/1.3 var(--pixel)}
.chip b{display:block;font:18px/1.2 var(--pixel)}
.chip[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.chip i{display:block;font-style:normal;font-size:11px;opacity:.85}

.card{background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:12px;margin:0 0 16px}
.card h2{margin:0 0 6px;font:18px/1.35 var(--pixel)}
.card h3{margin:0;font:15px/1.4 var(--pixel)}
.muted{color:var(--muted)}
.small{font-size:13px}
.dayhead .row{display:flex;gap:12px;align-items:flex-start}
.bigdate{font:32px/1 var(--pixel);background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);padding:8px 8px 6px;text-align:center;min-width:92px}
.bigdate small{display:block;font:13px/1.3 var(--pixel);margin-top:4px}
.stay{margin-top:10px;padding:8px 10px;background:var(--card2);border:2px dashed var(--line);font-size:14px}
.stay div+div{margin-top:4px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}

.item{--k:#7a869f;position:relative;display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--card);
  border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);margin:0 0 14px;padding:10px 10px 10px 14px}
.item::before{content:"";position:absolute;left:-3px;top:-3px;bottom:-3px;width:6px;background:var(--k)}
.k-flight,.k-train{--k:#3b7de0}.k-car{--k:#7a869f}.k-food{--k:#e0523f}.k-cafe{--k:#a8703a}
.k-sight{--k:#2fa36b}.k-shop{--k:#9a5bd6}.k-hotel{--k:#2ba3a3}.k-warn{--k:#e8a317}
.time{align-self:start;text-align:center;font:15px/1.25 var(--pixel);background:var(--card2);border:2px solid var(--line);
  padding:6px 2px;white-space:pre-line;word-break:keep-all}
.time.soft{font-size:12px;color:var(--muted)}
.time.none{background:var(--tbd-bg);color:var(--tbd-ink);font-size:12px}
.item h3 .ico{margin-right:4px}
.item .sub{font-size:13px;color:var(--muted);margin:2px 0 0}
.item .note{font-size:14px;margin:6px 0 0}
.tag{display:inline-block;font:11px/1.5 var(--pixel);padding:0 5px;border:2px solid var(--line);margin-left:4px;vertical-align:middle;white-space:nowrap}
.tag.tbd{background:var(--tbd-bg);color:var(--tbd-ink)}
.tag.est{background:var(--est-bg);color:var(--est-ink)}
.tag.ok{background:var(--ok);color:var(--ok-ink)}
.tag.opt{background:var(--opt-bg);color:var(--opt-ink)}
.tag.bf{background:#ffd9b3;color:#6a3500}
details.det{margin-top:8px}
details.det summary{cursor:pointer;font:13px var(--pixel);padding:4px 0;list-style:none}
details.det summary::before{content:"▶ ";font-size:10px}
details.det[open] summary::before{content:"▼ "}
details.det summary::-webkit-details-marker{display:none}
dl.f{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
dl.f dt{font:13px var(--pixel);color:var(--muted)}
dl.f dd{margin:0;word-break:break-word}
.btn{display:inline-block;font:13px/1.2 var(--pixel);padding:9px 12px;min-height:40px;border:2px solid var(--line);background:var(--card);
  color:var(--ink);box-shadow:2px 2px 0 var(--shadow);text-decoration:none;margin:8px 8px 0 0;cursor:pointer}
.btn.go{background:var(--blue);color:var(--blue-ink)}
.btn.red{background:var(--accent);color:var(--accent-ink)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.sm{padding:6px 10px;min-height:34px;margin-top:0}

.cand summary{cursor:pointer;font:15px var(--pixel)}
.cand ul{margin:10px 0 0;padding:0;list-style:none}
.cand li{padding:8px 0;border-top:2px dashed var(--line);font-size:14px}
.cand li b{font-weight:700}
.pager{display:flex;justify-content:space-between;gap:8px;margin:4px 0 16px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);border-top:3px solid var(--line);
  padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tabs a{display:block;text-align:center;text-decoration:none;font:12px/1.3 var(--pixel);color:var(--muted);padding:6px 0 5px;border:2px solid transparent}
.tabs a .ic{display:block;position:relative;width:28px;height:28px;margin:0 auto 3px}
.px{display:block;width:28px;height:28px}
.px .k{fill:var(--ink)}.px .w{fill:var(--card)}.px .r{fill:#d4372c}.px .b{fill:#3b7de0}.px .y{fill:#ffb62e}.px .g{fill:#2fa36b}.px .s{fill:#8cc2f5}
.bdg{position:absolute;top:-8px;right:-16px;min-width:18px;height:18px;padding:0 4px;background:#e5322d;color:#fff;font:700 11px/18px var(--pixel);font-style:normal;text-align:center;
  clip-path:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px))}
.chip{position:relative}
.chip .bdg{top:-8px;right:-7px;min-width:16px;height:16px;padding:0 3px;font-size:10px;line-height:16px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--line);background:var(--card2)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0 0}
.kv dt{font:13px var(--pixel);color:var(--muted)}.kv dd{margin:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border:2px solid var(--line);padding:6px 8px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font:13px var(--pixel);background:var(--card2)}
.scroll-x{overflow-x:auto}
.cancelled{opacity:.75}
.cancelled h3{text-decoration:line-through}

.chk{list-style:none;margin:6px 0 0;padding:0}
.chk li{display:flex;align-items:center;gap:6px;border-top:2px dashed var(--line);padding:4px 0}
.chk label{flex:1;display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;min-width:0}
.chk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin:2px 0 0;accent-color:var(--accent)}
.chk .done{text-decoration:line-through;color:var(--muted)}
.x{font:14px var(--pixel);width:36px;height:36px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.addrow{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=number],select{font:15px var(--sans);color:var(--ink);background:var(--card);border:2px solid var(--line);padding:8px 10px;min-height:40px;min-width:0;width:100%;border-radius:0}
.addrow input{flex:1}
.addrow .btn{margin:0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form label.l{font:12px var(--pixel);color:var(--muted);display:block;margin-bottom:2px}
.split{display:flex;flex-wrap:wrap;gap:6px 14px}
.split label{display:flex;gap:6px;align-items:center;font-size:14px}
.split input{width:20px;height:20px;accent-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.lg i{display:inline-block;width:22px;height:0;border-top:4px solid var(--accent);vertical-align:middle;margin-right:4px}
.lg i.tr{border-top:4px dashed var(--blue)}.lg i.gr{border-top:4px dotted var(--muted)}
svg.map{display:block;width:100%;height:auto;background:var(--sea);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
svg.map text{font-family:var(--pixel);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.foot{font-size:12px;color:var(--muted);margin:10px 0 20px}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:4px 0;border-top:2px dashed var(--line)}
.empty{padding:14px;text-align:center;border:2px dashed var(--line);color:var(--muted);font-size:14px}
.banner .c-white{fill:#fff}.banner .c-red{fill:#d4372c}.banner .c-brick{fill:#a8442f}.banner .c-wood{fill:#7b5230}.banner .c-tree{fill:#2f7d4f}
.banner .c-water{fill:#3f8fe0}.banner .c-water2{fill:#8cc2f5}.banner .c-dark{fill:#1b2440}.banner .c-lamp{fill:#ffd24a}.banner .c-orange{fill:#f08a1c}.banner .c-steel{fill:#8a96ad}.banner .c-beer{fill:#f0a20c}
.time small{display:block;font:10px/1.2 var(--pixel);color:var(--muted);margin-top:3px}
.dur{font-size:13px;margin:4px 0 0;color:var(--blue)}
.tipbox{margin:10px 0 0;padding:8px 10px;background:var(--card2);border:2px dashed var(--accent);font-size:14px}
#snow{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:15}
.px .n{fill:#7b5230}.px .p{fill:#9a5bd6}.px .t{fill:#2ba3a3}
.x .px{width:20px;height:20px;margin:0 auto}
.px.in{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:6px}
.px.in.sm{width:16px;height:16px;vertical-align:-3px;margin-right:4px}
h2.sec{font:18px var(--pixel);margin:20px 0 10px}
.ticket{background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);margin:0 0 16px;overflow:hidden}
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;font:13px var(--pixel);border-bottom:3px solid var(--line)}
.tk-top b{font:19px var(--pixel)}
.tk-top.red{background:#d4372c;color:#fff}.tk-top.yellow{background:#ffd24a;color:#2a2200}
.tk-main{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:12px 10px 10px;align-items:start}
.tk-side{min-width:0}.tk-side.r{text-align:right}
.tk-code{font:30px/1 var(--pixel)}
.tk-city{font-size:12px;color:var(--muted);margin-top:2px}
.tk-time{font:24px/1.2 var(--pixel);margin-top:8px}
.tk-date{font-size:12px}
.tk-term{font-size:12px;color:var(--muted);margin-top:2px}
.tk-mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px;min-width:84px}
.tk-route{display:flex;align-items:center;gap:2px;width:100%}
.tk-route i{flex:1;border-top:3px dotted var(--line);min-width:6px}
.tk-route .px{flex:0 0 auto}
.tk-dur,.tk-ac{font:12px var(--pixel);color:var(--muted);text-align:center}
.tk-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:8px 10px;border-top:3px dashed var(--line);font:14px var(--pixel)}
.tk-foot small{display:block;font:11px var(--sans);color:var(--muted)}
.tk-foot .w2{grid-column:1/-1}
.tk-bar{display:block;width:calc(100% - 20px);height:22px;margin:4px 10px 10px;fill:var(--ink)}
.px .cr{fill:#fff3d6}
.px.envbig{width:224px;height:160px;margin:0 auto 10px}
.dot{display:inline-block;width:8px;height:8px;background:#e5322d;margin-left:6px;vertical-align:middle}
.lt-ov{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(8,12,28,.62);padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.lt-ov[hidden]{display:none}
body.lt-open{overflow:hidden}
.lt-card{position:relative;width:100%;max-width:440px;margin:auto 0}
.lt-x{position:absolute;top:8px;right:8px;z-index:2;background:#fff3d6;border:2px solid #2b2233}
.lt-env{text-align:center;background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:28px 16px 20px}
.lt-env h2{font:20px var(--pixel);margin:0 0 4px}
.lt-env .btn{margin:12px 0 0}
.lt-paper{background:#fff3d6;color:#2b2233;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:18px 16px 20px;animation:ltrise .35s steps(6) both}
@keyframes ltrise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.lt-paper h2{font:20px var(--pixel);margin:0 44px 2px 0}
.lt-from{margin:0 0 12px;font-size:13px;color:#7a6a58}
.lt-paper p{margin:10px 0;font-size:15px}
.lt-stamps{display:flex;gap:10px;margin:10px 0}
.lt-stamps div{flex:1;border:3px dashed #b3523f;padding:6px 8px;text-align:center;color:#b3523f}
.lt-stamps small{display:block;font:11px var(--pixel)}
.lt-stamps b{font:17px var(--pixel)}
.code{font:700 17px var(--pixel);background:#ffe27a;color:#4d3500;padding:0 6px;border:2px solid #2b2233}
.code::after{content:"••••";letter-spacing:2px}
.show .code::after{content:attr(data-c);letter-spacing:1px}
.lt-paper .btn{color:#2b2233;background:#fff;border-color:#2b2233;box-shadow:2px 2px 0 #2b2233}
.lt-paper .btn.go{background:#2458c9;color:#fff}
.lt-addr{border:3px solid #2b2233;background:#fff;margin:12px 0}
.lt-addr>div{display:flex;gap:8px;align-items:center;padding:8px 10px;border-top:2px dashed #b9a98f;flex-wrap:wrap}
.lt-addr>div:first-child{border-top:0}
.lt-addr small{font:11px var(--pixel);color:#7a6a58;min-width:74px}
.lt-addr span{flex:1;min-width:140px;user-select:all}
.lt-addr .btn{margin:0}
.lt-sign{text-align:right;font:16px var(--pixel)}
.avs{display:flex;gap:6px;margin-top:6px}
.px.av{display:block;width:36px;height:36px}
.ttl-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.hav{display:inline-flex;gap:3px}
.hav .px.av{width:26px;height:26px}
.px .o{fill:#f08a1c}
.prompt{margin:10px 0 0;font:14px var(--pixel);color:var(--accent)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;font:14px/1.3 var(--pixel);padding:10px;min-height:68px;border:3px solid var(--line);background:var(--card);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.choice small{font:12px var(--sans);color:var(--muted)}
.choice .px.in{margin:0 0 2px}
.choice.on{background:var(--accent);color:var(--accent-ink)}
.choice.on small{color:var(--accent-ink);opacity:.85}
.choice.on::after{content:"▶ 已選";font:11px var(--pixel);margin-top:2px}
.choice:active{transform:translate(2px,2px);box-shadow:none}
.pickd{margin-top:8px;padding:8px 10px;border:2px dashed var(--line);background:var(--card2)}
.pickd h4{margin:0 0 4px;font:15px var(--pixel)}
.pop{background:var(--card);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:18px 16px 16px}
.pop h2{margin:0 44px 4px 0;font:20px var(--pixel)}
.popopts{display:grid;gap:10px;margin-top:10px}
.choice.popopt{width:100%}
.choice.popopt small{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<header class="top">
  <div class="ttl"><div class="ttl-row"><span>北海鱈魚香絲</span><span class="hav" id="hav"></span></div><small>北海道 2026.11.21 – 11.29</small></div>
  <button class="tbtn" id="themeBtn" data-act="theme" type="button"></button>
</header>
<main class="wrap" id="app"></main>

function itemHTML(it,dayMode){

  if(it.min)return '<article class="item k-'+(it.kind||'sight')+'"><div class="time">'+esc(it.time)+'</div><div><h3>'+icon(KIND[it.kind||'sight'],'in')+esc(it.title)+'</h3>'+(it.who?'<div class="avs">'+it.who.map(avatar).join('')+'</div>':'')+'</div></article>';
  var kind=it.kind||'sight';
  var navs=it.navs||(it.nav?[[null,it.nav]]:[]);
  var mode=it.mode||dayMode;
  var missF=[['地址','addr'],['交通','transit'],['營業','hours']].filter(function(r){var v=it[r[1]];return v===undefined||v===''||v===true||(v&&v.tbd)}).map(function(r){return r[0]});
  var miss=(missF.length&&(it.flags||[]).indexOf('tbd')<0)?'<span class="tag tbd">待確認：'+missF.join('・')+'</span>':'';
  var flags=(it.flags||[]).map(function(f){return f==='est'?EST:TBD}).join('');
  var tags=(it.booked?'<span class="tag ok">已預約</span>':'')+(it.bf?BF(it.bf):'')+(it.opt?'<span class="tag opt">備選</span>':'')+flags+miss;
  var tcls='time',ttxt;

  var tm='<div class="'+tcls+'">'+esc(ttxt)+(it.est&&it.time?'<small>估算</small>':'')+'</div>';
  var rows=[['地址','addr'],['交通','transit'],['營業時間','hours']].filter(function(r){return it[r[1]]!==null})
    .map(function(r){return '<dt>'+r[0]+'</dt><dd>'+fld(it[r[1]])+'</dd>'}).join('');
  var btns='';
  if(navs.length===1){
    btns='<a class="btn go" target="_blank" rel="noopener" href="'+dir(navs[0][1],mode)+'">導航</a><a class="btn" target="_blank" rel="noopener" href="'+search(navs[0][1])+'">地圖</a>';

    +(it.dur?'<p class="dur">'+icon('clock','in sm')+esc(it.dur)+EST+'</p>':'')
    +(it.note?'<p class="note">'+esc(it.note)+'</p>':'')
    +'<details class="det"'+(openAll?' open':'')+'><summary>地址・交通・營業時間</summary><dl class="f">'+rows+'</dl></details>'
    +(btns?'<div>'+btns+'</div>':'')+'</div></article>';
}

/* ---------- money ---------- */
function calcMoney(){
  var r=Number(rate)||0,paid={},owed={};
  PEOPLE.forEach(function(p){paid[p]=0;owed[p]=0});
  exp.forEach(function(e){
    var twd=e.cur==='JPY'?e.amt*r:e.amt;
    if(!e.who||!e.split.length)return;
    paid[e.who]+=twd;var s=twd/e.split.length;e.split.forEach(function(p){owed[p]+=s});
  });
  var bal={};PEOPLE.forEach(function(p){bal[p]=paid[p]-owed[p]});
  var cr=PEOPLE.filter(function(p){return bal[p]>0.5}).sort(function(a,b){return bal[b]-bal[a]});
  var db=PEOPLE.filter(function(p){return bal[p]<-0.5}).sort(function(a,b){return bal[a]-bal[b]});
  var left={};PEOPLE.forEach(function(p){left[p]=bal[p]});
  var tx=[];
  db.forEach(function(d){cr.forEach(function(c){
    if(left[d]<-0.5&&left[c]>0.5){var a=Math.min(-left[d],left[c]);tx.push([d,c,a]);left[d]+=a;left[c]-=a}
  })});
  return {paid:paid,owed:owed,bal:bal,tx:tx,r:r};
}

function tbdIn(html){
  var d=document.createElement('div');d.innerHTML=html;

function badgeFor(v){
  if(v==='day')return dayTbd().reduce(function(a,b){return a+b},0);
  if(v==='flights')return tbdIn(renderFlights());
  if(v==='map')return tbdIn(renderMap());
  if(v==='weather')return DAYS.filter(function(d){return !(wx[d.id]||'').trim()}).length;
  if(v==='lists')return lists.todos.filter(function(i){return !i.done}).length;
  if(v==='money')return tbdIn(renderMoney());
  return 0;
}
var curView='day';

function openLetter(opener){
  ltOpener=opener||null;
  var ov=document.getElementById('lt');

  ov.hidden=false;document.body.classList.add('lt-open');

function readLetter(){
  var st=document.getElementById('ltstage');if(!st)return;

function closeLetter(){
  var ov=document.getElementById('lt');ov.hidden=true;ov.innerHTML='';document.body.classList.remove('lt-open');
  if(ltOpener&&ltOpener.focus)ltOpener.focus();
}
function copyText(t,btn){
  var o=btn.textContent;
  function done(ok){btn.textContent=ok?'已複製':'請長按文字複製';setTimeout(function(){btn.textContent=o},1500)}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){done(true)},function(){done(false)});return}}catch(e){}
  try{var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok)}catch(e){done(false)}
}

      +(c.hours?'<small>營業 '+esc(c.hours)+'</small>':'')+(typeof c.addr==='string'?'<small>'+esc(c.addr)+'</small>':'')+'</button>';

/* ---------- router ---------- */
var VIEWS=['flights','map','weather','lists','money'];
var lastDay=store.get('day',null)||todayId()||1;
var curHash=null,rendered=null;
function route(){
  var hsh=curHash!==null?curHash:(location.hash||'').slice(1),view,day=null,m=/^day-([1-9])$/.exec(hsh);
  rendered=hsh;
  if(m){view='day';day=+m[1];lastDay=day;store.set('day',day)}
  else if(VIEWS.indexOf(hsh)>-1)view=hsh;
  else{view='day';day=lastDay}
  var app=document.getElementById('app');
  var map={day:function(){return renderDay(day)},flights:renderFlights,map:renderMap,weather:renderWeather,lists:renderLists,money:renderMoney};
  app.innerHTML=map[view]();
  curView=view;
  drawTabs(view);
}
function go(keepScroll){var y=window.scrollY;route();window.scrollTo(0,keepScroll?y:0)}
function navTo(h){
  curHash=h;
  try{location.hash=h}catch(e){}
  if(h!==rendered)go(false);
}
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').slice(1);
  if(h===rendered)return;
  curHash=null;go(false);
});

/* ---------- events ---------- */
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='lt'){closeLetter();return}
  var an=ev.target.closest&&ev.target.closest('a[href^="#"]');
  if(an){ev.preventDefault();navTo(an.getAttribute('href').slice(1));return}
  var el=ev.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),k=el.getAttribute('data-k'),id=el.getAttribute('data-id');
  if(a==='theme'){theme=theme==='auto'?'light':(theme==='light'?'dark':'auto');store.set('theme',theme);applyTheme()}
  else if(a==='toggleAll'){openAll=!openAll;go(true)}
  else if(a==='pick'){var pk=el.getAttribute('data-key'),pi=+el.getAttribute('data-i');picks[pk]=(picks[pk]===pi?null:pi);store.set('pick',picks);var pop=CH[pk]&&CH[pk].choices[pi]&&CH[pk].choices[pi].popup;go(true);if(pop&&picks[pk]===pi)openPopup(pop,el)}
  else if(a==='pickpop'){var qk=el.getAttribute('data-key'),qi=+el.getAttribute('data-i');picks[qk]=qi;store.set('pick',picks);closeLetter();go(true)}
  else if(a==='letter'){openLetter(el)}
  else if(a==='ltopen'){readLetter()}
  else if(a==='ltclose'){closeLetter()}
  else if(a==='code'){var pp=document.getElementById('ltp');pp.classList.toggle('show');document.getElementById('codeLbl').textContent=pp.classList.contains('show')?'藏起密碼':'看鑰匙盒密碼'}
  else if(a==='copy'){copyText(el.getAttribute('data-t'),el)}
  else if(a==='del'){lists[k]=lists[k].filter(function(i){return i.id!==id});store.set(k,lists[k]);go(true)}
  else if(a==='add'){addItem(k)}
  else if(a==='addExp'){addExpense()}
  else if(a==='delExp'){exp=exp.filter(function(e){return e.id!==id});store.set('exp',exp);go(true)}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.matches&&t.matches('[data-act="tick"]')){
    var k=t.getAttribute('data-k'),id=t.getAttribute('data-id');
    lists[k].forEach(function(i){if(i.id===id)i.done=t.checked});
    store.set(k,lists[k]);go(true);
  }else if(t.id==='rate'){
    var v=parseFloat(t.value);rate=isFinite(v)&&v>=0?v:0.2;store.set('rate',rate);go(true);
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.hasAttribute&&t.hasAttribute('data-wx')){
    wx[t.getAttribute('data-wx')]=t.value;store.set('wx',wx);
    var row=t.closest('.unit'),st=row&&row.querySelector('.small.muted');
    if(st)st.innerHTML='預報：'+(t.value.trim()?'':TBD);
    drawTabs(curView);
  }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&!document.getElementById('lt').hidden){closeLetter();return}
  if(ev.key==='Enter'&&ev.target.hasAttribute&&ev.target.hasAttribute('data-add')){ev.preventDefault();addItem(ev.target.getAttribute('data-add'))}
});
function addItem(k){
  var inp=document.getElementById('add-'+k),v=(inp.value||'').trim();
  if(!v){inp.focus();return}
  lists[k].push({id:uid(),t:v});store.set(k,lists[k]);go(true);
}
function addExpense(){
  var name=(document.getElementById('e-name').value||'').trim();
  var amt=parseFloat(document.getElementById('e-amt').value);
  var split=Array.prototype.map.call(document.querySelectorAll('.e-split:checked'),function(x){return x.value});
  if(!name||!isFinite(amt)||amt<=0||!split.length){document.getElementById('e-msg').textContent='請填寫項目、金額，並至少選一位分攤對象。';return}
  exp.push({id:uid(),name:name,amt:amt,cur:document.getElementById('e-cur').value,who:document.getElementById('e-who').value,day:document.getElementById('e-day').value,split:split});
  store.set('exp',exp);go(true);
}

function startSnow(){
  var cv=document.getElementById('snow');
  if(!cv||!cv.getContext)return;
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
  if(rm&&rm.matches)return;
  var ctx=cv.getContext('2d');if(!ctx)return;
  var W=0,H=0,fl=[],N=34,fill='#ffffff',edge='rgba(36,88,201,.55)',tick=0,last=0;
  function size(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function colors(){
    var cs=getComputedStyle(document.documentElement);
    fill=(cs.getPropertyValue('--flake')||'#fff').trim()||'#fff';
    edge=(cs.getPropertyValue('--flake-edge')||'transparent').trim()||'transparent';
  }
  function mk(init){
    return {x:Math.random()*W,y:init?Math.random()*H:-8,t:Math.random()<0.55?0:1,v:14+Math.random()*22,a:Math.random()*6.28,w:0.4+Math.random()*0.8};
  }
  function shape(x,y,t,col){
    ctx.fillStyle=col;
    if(t===0){ctx.fillRect(x,y,4,4)}
    else{ctx.fillRect(x+2,y,2,6);ctx.fillRect(x,y+2,6,2)}
  }
  function frame(ts){
    var dt=Math.min((ts-last)/1000||0.016,0.05);last=ts;
    if(tick++%60===0)colors();
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<fl.length;i++){
      var f=fl[i];
      f.y+=f.v*dt;f.a+=f.w*dt;
      var x=Math.round((f.x+Math.sin(f.a)*10)/2)*2,y=Math.round(f.y/2)*2;
      shape(x+1,y+1,f.t,edge);shape(x,y,f.t,fill);
      if(f.y>H+8){fl[i]=mk(false);fl[i].x=Math.random()*W}
    }
    requestAnimationFrame(frame);
  }
  size();colors();
  for(var i=0;i<N;i++)fl.push(mk(true));
  window.addEventListener('resize',size);
  requestAnimationFrame(frame);
}

applyTheme();
document.getElementById('hav').innerHTML=['涵','蘇','茜','周'].map(avatar).join('');
route();
startSnow();
